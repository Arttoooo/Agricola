<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#244b3a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Agricola Card Finder</title>
<style>
:root{color-scheme:light;--green:#244b3a;--green2:#356a51;--paper:#f4f5f0;--ink:#17231d;--muted:#68766d;--line:#dfe5dc;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif}header{background:var(--green);color:#fff;padding:22px 18px 24px;border-radius:0 0 22px 22px}header .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}h1{font-size:25px;margin:6px 0 5px}header p{margin:0;font-size:14px;opacity:.85}.wrap{padding:16px;max-width:760px;margin:auto}.searchbox{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 16px #13261b0a}.label{font-size:13px;font-weight:700;margin-bottom:8px;display:block}.searchrow{display:flex;gap:8px}input{min-width:0;flex:1;border:1px solid #cbd5ca;border-radius:11px;padding:13px 12px;font-size:17px;background:#fff;color:var(--ink);outline:none}input:focus{border-color:var(--green2);box-shadow:0 0 0 3px #356a511c}button{border:0;border-radius:11px;background:var(--green);color:#fff;font-weight:700;padding:0 17px;font-size:15px}button.secondary{background:#e7eee8;color:var(--green);padding:10px 13px}.hint{font-size:12px;color:var(--muted);margin-top:9px}.status{font-size:13px;color:var(--muted);padding:14px 2px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px}.result-head h2{font-size:17px;margin:0}.count{font-size:12px;background:#e2ebe3;color:var(--green);padding:5px 9px;border-radius:20px;font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 3px 12px #13261b08}.cardtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card h3{margin:0 0 5px;font-size:19px;line-height:1.25}.sub{font-size:12px;color:var(--muted);line-height:1.5}.pill{background:#edf2ed;color:#315743;font-size:11px;font-weight:700;border-radius:6px;padding:5px 7px;white-space:nowrap}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.field{padding-top:9px;border-top:1px solid #edf0eb;min-width:0}.field.full{grid-column:1/-1}.field dt{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:750;margin-bottom:4px}.field dd{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.field.full dd{font-size:14px;line-height:1.55}.empty{padding:24px 14px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cdd7cd;border-radius:14px}.foot{text-align:center;color:var(--muted);font-size:11px;padding:22px 0 28px}
@media(min-width:600px){header{padding-left:max(22px,calc((100% - 720px)/2));padding-right:max(22px,calc((100% - 720px)/2))}.fields{grid-template-columns:repeat(3,minmax(0,1fr))}.field.full{grid-column:1/-1}}
</style></head><body>
<header><div class="eyebrow">Offline card database</div><h1>🌾 Agricola Card Finder</h1><p>Enter a card number to see every matching card and its details.</p></header>
<main class="wrap"><section class="searchbox"><label class="label" for="number">Card number</label><div class="searchrow"><input id="number" type="search" inputmode="numeric" autocomplete="off" placeholder="e.g. 1" aria-label="Card number"><button id="find">Find</button></div><div class="hint">If a number appears in multiple editions or decks, all matches will be shown.</div></section><div id="status" class="status">Loading your local database…</div><section id="results" aria-live="polite"></section><div class="foot">Stored on this device · Works without internet</div></main>
<script>
const labels={Edition:'Edition',Publisher:'Publisher','Base/Expansion':'Base / Expansion',Deck:'Deck',Number:'Card number',Type:'Type','Player(s)':'Players',Name:'Name',Cost:'Cost',VPs:'Victory points',Prerequisites:'Prerequisites','Passing Left':'Passing left','Card Category (Revised only)':'Card category (Revised only)',Text:'Card text'};
const order=['Edition','Publisher','Base/Expansion','Deck','Number','Type','Player(s)','Name','Cost','VPs','Prerequisites','Passing Left','Card Category (Revised only)','Text'];
let cards=[];const input=document.getElementById('number'), status=document.getElementById('status'), results=document.getElementById('results');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nice(v){const s=String(v??'').trim();return s===''||s==='-'?'—':s;}
function search(){const q=input.value.trim();results.innerHTML='';if(!q){status.textContent=`Database ready · ${cards.length.toLocaleString()} cards available`;return;}const found=cards.filter(c=>String(c.Number??'').trim().toLowerCase()===q.toLowerCase());status.textContent=found.length?`${found.length} matching record${found.length===1?'':'s'} found`: 'No exact card number found.';if(!found.length){results.innerHTML='<div class="empty">No card matched <b>'+esc(q)+'</b>.<br>Check the number and try again.</div>';return;}const head=document.createElement('div');head.className='result-head';head.innerHTML='<h2>Matching cards</h2><span class="count">'+found.length+' result'+(found.length===1?'':'s')+'</span>';results.appendChild(head);found.forEach((c,i)=>{const title=nice(c.Name)==='—'?'Unnamed card':nice(c.Name);const meta=[nice(c.Edition),nice(c['Base/Expansion']),nice(c.Deck)].filter(x=>x!=='—').join(' · ');const card=document.createElement('article');card.className='card';let fields=order.filter(k=>k!=='Name'&&String(c[k]??'').trim()!=='').map(k=>`<div class="field ${k==='Text'?'full':''}"><dt>${esc(labels[k]||k)}</dt><dd>${esc(nice(c[k]))}</dd></div>`).join('');card.innerHTML=`<div class="cardtop"><div><h3>${esc(title)}</h3><div class="sub">${esc(meta||'Card record')} · Result ${i+1}</div></div><span class="pill">#${esc(nice(c.Number))}</span></div><dl class="fields"><div class="field"><dt>Type</dt><dd>${esc(nice(c.Type))}</dd></div><div class="field"><dt>Cost</dt><dd>${esc(nice(c.Cost))}</dd></div><div class="field"><dt>Victory points</dt><dd>${esc(nice(c.VPs))}</dd></div>${fields}</dl>`;results.appendChild(card);});}
document.getElementById('find').addEventListener('click',search);input.addEventListener('keydown',e=>{if(e.key==='Enter')search()});input.addEventListener('input',()=>{if(!input.value.trim())search()});
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
fetch('cards.json').then(r=>{if(!r.ok)throw Error('Could not load database');return r.json()}).then(data=>{cards=data;status.textContent=`Database ready · ${cards.length.toLocaleString()} cards available`;}).catch(()=>{status.textContent='Could not load the bundled card database. Please reinstall the app.'});
</script></body></html>
